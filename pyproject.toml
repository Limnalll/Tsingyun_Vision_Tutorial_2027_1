[project]
name = "mcl-arena"
version = "0.1.0"
description = "Motion and measurement models from Probabilistic Robotics (Thrun, Burgard, Fox), chapters 5-6, assembled into a Monte Carlo localization stack."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pygame>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
